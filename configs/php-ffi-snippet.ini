; ============================================================================
; php-ffi-snippet.ini — PHP FFI 扩展配置片段 (web 页面调用 sigcore.dll 需要)
; 追加到: E:\xampp\php\php.ini  (CLI 用的 C:\xampp\php\php.ini 同理)
; setup.bat 会自动追加, 此文件仅为手动配置参考
; ============================================================================

extension=php_ffi
ffi.enable=true
