# ============================================================================
# httpd-proxy.conf — Apache 反向代理配置 (将非 PHP 请求转发给 C++ apihub)
# 安装位置: E:\xampp\apache\conf\extra\httpd-proxy.conf
# 同时需在 httpd.conf 启用:
#   LoadModule proxy_module modules/mod_proxy.so
#   LoadModule proxy_http_module modules/mod_proxy_http.so
#   Include conf/extra/httpd-proxy.conf
# 效果: 访问 http://localhost/ 时, *.php 与 *.html 及归档目录仍走 Apache,
#       其余全部路径转发到 C++ apihub (127.0.0.1:8090) 的内嵌面板/接口
# ============================================================================

ProxyPassMatch "^/(?!.*\.php)(?!.*\.html)(?!.*_archived)(.*)$" "http://127.0.0.1:8090/$1"
ProxyPassReverse "/" "http://127.0.0.1:8090/"
